{% extends 'base.html' %}

{% block title %} Delete product {% endblock %}


{% block content %}
<h2>Delete product</h2>
<p>Are you sure you want to delete <strong>{{ products.product_name }}</strong></p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{% url 'products_list' %}"><strong>Cancel</strong></a>

</form>


{% endblock %}
